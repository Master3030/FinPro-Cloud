<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FinTrack Pro v3.0 | Ultimate Debug</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    
    <!-- Firebase Compat (Más estable) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #6366f1; --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
            --bg-dark: #0f172a; --bg-card: rgba(30, 41, 59, 0.8); --text-primary: #f1f5f9; --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: var(--text-primary); min-height: 100vh; padding-bottom: 120px; }
        
        /* Auth Styles */
        #authScreen { position: fixed; inset: 0; background: var(--bg-dark); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        #authScreen.hidden { display: none; }
        .auth-card { background: var(--bg-card); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 24px; padding: 40px 30px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        .logo { width: 80px; height: 80px; background: linear-gradient(135deg, var(--primary), #06b6d4); border-radius: 20px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 32px; }
        h1 { font-family: 'Poppins'; font-size: 28px; margin-bottom: 8px; background: linear-gradient(135deg, #fff, var(--text-muted)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        input, select { width: 100%; padding: 12px; background: rgba(15,23,42,0.6); border: 1px solid var(--border); border-radius: 10px; color: white; margin-bottom: 15px; }
        .btn-primary { width: 100%; padding: 14px; background: var(--primary); border: none; border-radius: 12px; color: white; font-weight: 600; cursor: pointer; }
        
        /* Dashboard */
        .app-container { max-width: 480px; margin: 0 auto; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
        .chart-section { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        .tx-list { display: flex; flex-direction: column; gap: 10px; }
        .tx-item { background: rgba(255,255,255,0.05); padding: 14px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
        .tx-item.recurring { border-left: 4px solid var(--warning); }
        .tx-item.pending { border-left: 4px solid var(--danger); opacity: 0.8; }
        
        /* Debug Console */
        #debugConsole {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #000; color: #0f0; font-family: monospace;
            font-size: 11px; padding: 10px; height: 100px; overflow-y: auto;
            border-top: 2px solid var(--primary); z-index: 2000;
            display: none; opacity: 0.9;
        }
        #debugConsole.visible { display: block; }
        .log-entry { margin-bottom: 4px; border-bottom: 1px solid #333; padding-bottom: 2px; }
        .log-error { color: #ff5555; }
        .log-success { color: #55ff55; }
        .log-info { color: #55ffff; }
        #toggleDebug {
            position: fixed; bottom: 110px; right: 20px;
            background: var(--primary); color: white; border: none;
            padding: 8px 12px; border-radius: 20px; font-size: 12px;
            cursor: pointer; z-index: 2001; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Modal & FAB */
        .fab { position: fixed; bottom: 130px; right: 20px; width: 56px; height: 56px; background: var(--primary); border-radius: 50%; color: white; font-size: 28px; border: none; cursor: pointer; box-shadow: 0 8px 25px rgba(99,102,241,0.5); display: flex; align-items: center; justify-content: center; z-index: 90; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; display: none; align-items: flex-end; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: #1e293b; width: 100%; max-width: 480px; border-radius: 24px 24px 0 0; padding: 24px; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin: 15px 0; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

    <!-- AUTH SCREEN -->
    <div id="authScreen">
        <div class="auth-card">
            <div class="logo">️</div>
            <h1>FinTrack Pro v3</h1>
            <p style="color:var(--text-muted); margin-bottom:20px;">Con Depuración Avanzada</p>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginPass" placeholder="Contraseña" required>
                <button type="submit" class="btn-primary">Entrar</button>
            </form>
            <div style="margin-top:15px; font-size:12px; color:var(--text-muted);">
                <a onclick="showRegister()" style="color:var(--primary); cursor:pointer;">Crear cuenta</a>
            </div>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboardScreen" style="display:none;">
        <div class="app-container">
            <div class="header">
                <div>
                    <p id="currentDate" style="font-size:12px; color:var(--text-muted);"></p>
                    <h2 id="userName" style="font-family:'Poppins'; font-size:22px;">Hola...</h2>
                </div>
                <button onclick="handleLogout()" style="background:rgba(239,68,68,0.2); color:var(--danger); border:none; padding:6px 12px; border-radius:8px; cursor:pointer;">Salir</button>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div style="font-size:10px; color:var(--text-muted);">Balance Total</div>
                    <div id="totalBalance" style="font-family:'Poppins'; font-size:20px; font-weight:700;">$0.00</div>
                </div>
                <div class="stat-card">
                    <div style="font-size:10px; color:var(--text-muted);">Gastos Mes</div>
                    <div id="monthlyExpense" style="font-family:'Poppins'; font-size:20px; font-weight:700; color:var(--danger);">$0.00</div>
                </div>
            </div>

            <!-- Gráfico de Línea (Tendencia) -->
            <div class="chart-section">
                <div style="font-weight:600; margin-bottom:10px;">Tendencia Mensual</div>
                <div style="height:150px;"><canvas id="lineChart"></canvas></div>
            </div>

            <!-- Gráfico de Dona (Distribución) -->
            <div class="chart-section">
                <div style="font-weight:600; margin-bottom:10px;">Distribución</div>
                <div style="height:150px;"><canvas id="doughnutChart"></canvas></div>
            </div>

            <div style="font-weight:600; margin-bottom:10px;">Movimientos</div>
            <div id="txList" class="tx-list">
                <div style="text-align:center; padding:20px; color:var(--text-muted);">Cargando...</div>
            </div>
        </div>
    </div>

    <!-- DEBUG CONSOLE -->
    <button id="toggleDebug" onclick="toggleDebug()">🐛 Ver Logs</button>
    <div id="debugConsole">
        <div style="position:sticky; top:0; background:#000; padding-bottom:5px; border-bottom:1px solid #333; margin-bottom:5px;">
            <strong>DEBUG CONSOLE v3.0</strong> <span style="float:right; cursor:pointer;" onclick="clearLogs()">✕ Limpiar</span>
        </div>
        <div id="logContent"></div>
    </div>

    <!-- FAB & MODAL -->
    <button class="fab" onclick="openModal()">+</button>
    <div class="modal-overlay" id="addModal">
        <div class="modal-content">
            <h3 style="margin-bottom:15px;">Nuevo Movimiento</h3>
            <select id="txType" onchange="toggleRecurringOptions()">
                <option value="expense">Gasto</option>
                <option value="income">Ingreso</option>
            </select>
            <input type="text" id="txConcept" placeholder="Concepto">
            <input type="number" id="txAmount" placeholder="Monto" step="0.01">
            
            <div class="checkbox-group">
                <input type="checkbox" id="isRecurring" onchange="toggleRecurringOptions()">
                <label>Factura Recurrente</label>
            </div>
            
            <div id="dueDayGroup" style="display:none; margin-bottom:15px;">
                <label style="font-size:12px; color:var(--text-muted);">Vence el día:</label>
                <select id="dueDay">
                    <option value="1">Día 1</option><option value="5">Día 5</option>
                    <option value="10">Día 10</option><option value="15">Día 15</option>
                    <option value="20">Día 20</option><option value="25">Día 25</option>
                    <option value="30">Día 30</option>
                </select>
            </div>

            <button class="btn-primary" onclick="saveTransaction()">Guardar en Nube</button>
            <button onclick="closeModal()" style="width:100%; padding:12px; margin-top:10px; background:transparent; border:1px solid var(--border); color:var(--text-muted); border-radius:10px;">Cancelar</button>
        </div>
    </div>

    <script>
        // ================= CONFIGURACIÓN FIREBASE =================
        const firebaseConfig = {
            apiKey: "AIzaSyCOUFeLCyNhB5_jfyW3BNZZyUx_gPAQrCQ",
            authDomain: "finpro-app-5dc10.firebaseapp.com",
            projectId: "finpro-app-5dc10",
            storageBucket: "finpro-app-5dc10.firebasestorage.app",
            messagingSenderId: "625095962680",
            appId: "1:625095962680:web:c1e668b6fff0ce7f48b6cd"
        };

        // Inicialización con manejo de errores robusto
        try {
            firebase.initializeApp(firebaseConfig);
            log("✅ Firebase inicializado correctamente", "success");
        } catch (e) {
            log("❌ ERROR CRÍTICO AL INICIAR FIREBASE: " + e.message, "error");
        }

        const auth = firebase.auth();
        const db = firebase.firestore();
        
        // Forzar polling largo para evitar problemas de CORS en GitHub Pages
        db.settings({ experimentalForceLongPolling: true });
        log("⚙️ Configurado ForceLongPolling para compatibilidad GitHub Pages", "info");

        // Variables Globales
        let currentUser = null;
        let unsubTx = null;
        let currencySymbol = '$';
        let lineChartInst = null;
        let doughnutChartInst = null;

        // ================= SISTEMA DE LOGS (DEBUG) =================
        function log(msg, type = "info") {
            const consoleDiv = document.getElementById('debugConsole');
            const logContent = document.getElementById('logContent');
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${time}] ${msg}`;
            logContent.prepend(entry);
            console.log(`[FinTrack] ${msg}`);
            
            if(!consoleDiv.classList.contains('visible')) {
                // Opcional: Mostrar notificación visual si hay error
                if(type === 'error') toggleDebug(true);
            }
        }

        function toggleDebug(forceShow = false) {
            const el = document.getElementById('debugConsole');
            if(forceShow || !el.classList.contains('visible')) {
                el.classList.add('visible');
                document.getElementById('toggleDebug').textContent = '🐛 Ocultar Logs';
            } else {
                el.classList.remove('visible');
                document.getElementById('toggleDebug').textContent = '🐛 Ver Logs';
            }
        }

        function clearLogs() {
            document.getElementById('logContent').innerHTML = '';
        }

        // ================= DETECCIÓN DE MONEDA LOCAL =================
        function detectCurrency() {
            try {
                const locale = navigator.language || 'en-US';
                const region = locale.split('-')[1]; // Ej: 'MX' de 'es-MX'
                
                const currencyMap = {
                    'MX': 'MXN', 'CO': 'COP', 'PE': 'PEN', 'AR': 'ARS', 
                    'CL': 'CLP', 'ES': 'EUR', 'US': 'USD', 'VE': 'VES'
                };
                
                const currencyCode = currencyMap[region] || 'USD';
                const formatter = new Intl.NumberFormat(locale, { style: 'currency', currency: currencyCode });
                
                // Extraer símbolo probando con 1
                currencySymbol = formatter.format(1).replace('1', '').trim();
                log(`💰 Moneda detectada: ${currencyCode} (${currencySymbol})`, "success");
            } catch (e) {
                log("️ No se pudo detectar moneda local, usando $ por defecto", "info");
                currencySymbol = '$';
            }
        }

        // ================= AUTH LOGIC =================
        function showRegister() {
            // Implementación simple para demo
            alert("Función de registro habilitada en la consola de depuración. Intenta registrarte con el formulario principal.");
            // Aquí podrías expandir la UI para mostrar el formulario de registro completo
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            
            log(`🔑 Intentando login con: ${email}`, "info");
            
            auth.signInWithEmailAndPassword(email, pass)
                .then((userCredential) => {
                    log("✅ Login exitoso!", "success");
                })
                .catch((error) => {
                    log(` Error Login: ${error.code} - ${error.message}`, "error");
                    alert("Error: " + error.message);
                });
        }

        function handleLogout() {
            if(unsubTx) unsubTx();
            auth.signOut().then(() => {
                log("👋 Sesión cerrada", "info");
                location.reload();
            });
        }

        // Monitor de Auth
        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                log(`👤 Usuario autenticado: ${user.email} (UID: ${user.uid})`, "success");
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('dashboardScreen').style.display = 'block';
                document.getElementById('userName').textContent = `Hola, ${user.email.split('@')[0]}`;
                detectCurrency();
                updateDate();
                listenTransactions();
            } else {
                currentUser = null;
                log(" No hay usuario autenticado", "info");
                document.getElementById('authScreen').classList.remove('hidden');
                document.getElementById('dashboardScreen').style.display = 'none';
            }
        });

        // ================= TRANSACCIONES Y FIRESTORE =================
        function toggleRecurringOptions() {
            const isRec = document.getElementById('isRecurring').checked;
            const type = document.getElementById('txType').value;
            document.getElementById('dueDayGroup').style.display = (isRec && type === 'expense') ? 'block' : 'none';
        }

        function saveTransaction() {
            if(!currentUser) { log("❌ Error: No hay usuario logueado", "error"); return; }

            const concept = document.getElementById('txConcept').value.trim();
            const amount = parseFloat(document.getElementById('txAmount').value);
            const type = document.getElementById('txType').value;
            const isRecurring = document.getElementById('isRecurring').checked;
            const dueDay = parseInt(document.getElementById('dueDay').value) || 1;

            if(!concept || !amount) { alert("Completa los datos"); return; }

            const finalAmount = type === 'expense' ? -Math.abs(amount) : Math.abs(amount);
            const now = new Date();
            const currentMonthStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

            const txData = {
                uid: currentUser.uid,
                concept: concept,
                amount: finalAmount,
                type: type,
                isRecurring: isRecurring,
                dueDay: isRecurring ? dueDay : null,
                date: firebase.firestore.FieldValue.serverTimestamp(),
                paidMonth: isRecurring ? currentMonthStr : null
            };

            log("💾 Enviando datos a Firestore...", "info");
            log(JSON.stringify(txData), "info");

            db.collection('transactions').add(txData)
                .then((docRef) => {
                    log(`✅ ¡Guardado exitoso! ID: ${docRef.id}`, "success");
                    closeModal();
                    // La lista se actualizará sola gracias al onSnapshot
                })
                .catch((error) => {
                    log(`❌ ERROR AL GUARDAR: ${error.code} - ${error.message}`, "error");
                    if(error.code === 'permission-denied') {
                        alert("ERROR DE PERMISOS: Revisa las reglas de seguridad en Firebase Console > Firestore > Reglas.");
                    } else {
                        alert("Error al guardar. Revisa la consola de depuración abajo.");
                    }
                });
        }

        function deleteTransaction(id) {
            if(confirm("¿Borrar?")) {
                log("🗑️ Eliminando documento...", "info");
                db.collection('transactions').doc(id).delete()
                    .then(() => log("✅ Eliminado", "success"))
                    .catch(err => log(`❌ Error borrando: ${err.message}`, "error"));
            }
        }

        function listenTransactions() {
            if(!currentUser) return;
            
            log("👂 Escuchando cambios en tiempo real...", "info");
            
            const q = db.collection('transactions')
                .where('uid', '==', currentUser.uid)
                .orderBy('date', 'desc');

            unsubTx = q.onSnapshot(
                (snapshot) => {
                    log(`🔄 Recibidos ${snapshot.docs.length} documentos`, "info");
                    renderList(snapshot.docs);
                },
                (error) => {
                    log(`❌ ERROR EN LISTENER: ${error.code} - ${error.message}`, "error");
                    if(error.code === 'permission-denied') {
                        log("🚨 SOLUCIÓN: Ve a Firebase Console > Firestore > Reglas y publica las reglas correctas.", "error");
                    }
                }
            );
        }

        function renderList(docs) {
            const list = document.getElementById('txList');
            list.innerHTML = '';
            
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth() + 1;
            const todayDay = now.getDate();
            
            let totalBal = 0, monthExp = 0, incomeChart = 0, expenseChart = 0;
            const realTransactions = [];
            const dailyTotals = {}; // Para gráfico de línea

            docs.forEach(doc => {
                const tx = doc.data();
                tx.id = doc.id;
                totalBal += tx.amount;

                let txDate = tx.date?.toDate ? tx.date.toDate() : new Date();
                
                if(txDate.getFullYear() === currentYear && txDate.getMonth() + 1 === currentMonth) {
                    if(tx.amount > 0) incomeChart += tx.amount;
                    else {
                        monthExp += Math.abs(tx.amount);
                        expenseChart += Math.abs(tx.amount);
                    }
                    
                    // Preparar datos para gráfico de línea (día a día)
                    const dayKey = txDate.getDate();
                    if(!dailyTotals[dayKey]) dailyTotals[dayKey] = 0;
                    dailyTotals[dayKey] += tx.amount;
                }

                // Lógica Recurrente
                if(tx.isRecurring && tx.type === 'expense') {
                    const currentMonthStr = `${currentYear}-${String(currentMonth).padStart(2,'0')}`;
                    if(tx.paidMonth !== currentMonthStr && todayDay >= tx.dueDay) {
                        realTransactions.push({...tx, isVirtual: true, amount: -Math.abs(tx.amount), concept: tx.concept + " (Pendiente)", displayDate: `Vence día ${tx.dueDay}`});
                    } else if (tx.paidMonth === currentMonthStr) {
                        realTransactions.push(tx);
                    }
                } else {
                    realTransactions.push(tx);
                }
            });

            // Render HTML
            if(realTransactions.length === 0) list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted)">Sin movimientos</div>';
            
            realTransactions.forEach(tx => {
                const isPos = tx.amount > 0;
                const dateStr = tx.isVirtual ? tx.displayDate : (tx.date?.toDate ? tx.date.toDate().toLocaleDateString() : '');
                const div = document.createElement('div');
                div.className = `tx-item ${tx.isRecurring ? 'recurring' : ''} ${tx.isVirtual ? 'pending' : ''}`;
                div.innerHTML = `
                    <div>
                        <div style="font-weight:600;">${tx.concept}</div>
                        <div style="font-size:11px;color:var(--text-muted);">${dateStr}</div>
                    </div>
                    <div style="display:flex;align-items:center;gap:8px;">
                        <span style="font-weight:700;color:${isPos?'var(--success)':'var(--danger)'}">${isPos?'+':''}${currencySymbol}${Math.abs(tx.amount).toFixed(2)}</span>
                        ${!tx.isVirtual ? `<button onclick="deleteTransaction('${tx.id}')" style="background:none;border:none;color:var(--text-muted);cursor:pointer;">×</button>` : ''}
                    </div>
                `;
                list.appendChild(div);
            });

            document.getElementById('totalBalance').textContent = `${currencySymbol}${totalBal.toFixed(2)}`;
            document.getElementById('monthlyExpense').textContent = `${currencySymbol}${monthExp.toFixed(2)}`;
            
            renderCharts(incomeChart, expenseChart, dailyTotals);
        }

        function renderCharts(inc, exp, dailyData) {
            // Dona
            const ctxD = document.getElementById('doughnutChart').getContext('2d');
            if(doughnutChartInst) doughnutChartInst.destroy();
            doughnutChartInst = new Chart(ctxD, {
                type: 'doughnut',
                data: {
                    labels: ['Ingresos', 'Gastos'],
                    datasets: [{ data: [inc, exp], backgroundColor: ['#10b981', '#ef4444'], borderWidth: 0 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });

            // Línea
            const ctxL = document.getElementById('lineChart').getContext('2d');
            if(lineChartInst) lineChartInst.destroy();
            
            // Generar array de días 1-30
            const labels = Array.from({length: 30}, (_, i) => i + 1);
            const dataPoints = labels.map(day => dailyData[day] || 0);

            lineChartInst = new Chart(ctxL, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Balance Diario',
                        data: dataPoints,
                        borderColor: '#6366f1',
                        tension: 0.4,
                        fill: true,
                        backgroundColor: 'rgba(99, 102, 241, 0.1)'
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { x: { display: false }, y: { display: false } }, plugins: { legend: { display: false } } }
            });
        }

        function updateDate() {
            document.getElementById('currentDate').textContent = new Date().toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }

        function openModal() { document.getElementById('addModal').classList.add('active'); toggleRecurringOptions(); }
        function closeModal() { document.getElementById('addModal').classList.remove('active'); document.getElementById('txConcept').value=''; document.getElementById('txAmount').value=''; }
    </script>
</body>
</html>
